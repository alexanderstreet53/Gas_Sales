<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Happy Talk — a softer way to talk to yourself. Personality-tuned reminders for anxious spirals and perfectionist loops.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Happy Talk">

  <meta name="theme-color" content="#FFF8F2">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="icons/logo.svg?v=2">

  <title>Happy Talk</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #FFF8F2 0%, #E6DCFF 50%, #D6E8D2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #1F1B2E;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      pointer-events: none;
      transition: opacity 600ms ease;
    }
    #loading.hide { opacity: 0; }
    #loading .mark {
      width: 88px;
      height: 88px;
      filter: drop-shadow(0 14px 24px rgba(31, 27, 46, 0.18));
    }
    #loading .word {
      font-size: 13px;
      letter-spacing: 1.6px;
      text-transform: lowercase;
      opacity: 0.55;
    }
    #loading .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1F1B2E;
      opacity: 0.4;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50%      { opacity: 0.9; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img class="mark" src="icons/logo.svg" alt="Happy Talk">
    <div class="word">happy talk</div>
    <div class="pulse"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 700);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
